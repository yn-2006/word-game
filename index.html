<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2007 考研英语一 Text3 · 单词闯关游戏</title>
<style>
  :root{
    --bg1:#eef2ff; --bg2:#fdf2f8;
    --card:#ffffff; --ink:#1e1b4b; --muted:#6b7280;
    --primary:#4f46e5; --primary-2:#6366f1;
    --pink:#ec4899; --amber:#f59e0b;
    --ok:#16a34a; --okbg:#dcfce7;
    --bad:#dc2626; --badbg:#fee2e2;
    --line:#e5e7eb;
    --shadow:0 10px 30px rgba(79,70,229,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%);
    color:var(--ink); min-height:100vh; line-height:1.55;
  }
  .wrap{max-width:860px; margin:0 auto; padding:20px 16px 60px;}

  header{text-align:center; padding:10px 0 4px;}
  header h1{font-size:24px; margin:0; letter-spacing:.5px; background:linear-gradient(90deg,var(--primary),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  header p{color:var(--muted); margin:6px 0 0; font-size:13px;}

  /* 分类 chips */
  .cats{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 14px;}
  .cat{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:8px 14px; border-radius:999px; font-size:13.5px; cursor:pointer;
    transition:all .18s; font-weight:500;
  }
  .cat:hover{border-color:var(--primary-2);}
  .cat.active{background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 6px 16px rgba(79,70,229,.25);}
  .cat .n{opacity:.65; font-size:12px; margin-left:4px;}

  /* 模式 tabs */
  .modes{display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px; margin-bottom:14px; overflow-x:auto;}
  .mode{flex:1; min-width:92px; text-align:center; padding:9px 8px; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--muted); white-space:nowrap; transition:all .18s;}
  .mode.active{background:linear-gradient(90deg,var(--primary),var(--primary-2)); color:#fff; box-shadow:0 6px 14px rgba(79,70,229,.28);}

  /* 统计条 */
  .stats{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:16px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 14px; font-size:13px; color:var(--muted); box-shadow:0 4px 12px rgba(0,0,0,.03);}
  .stat b{color:var(--ink); font-size:15px; margin:0 2px;}
  .stat.streak b{color:var(--amber);}

  /* 卡片区 */
  #app{min-height:340px;}

  .card{
    background:var(--card); border-radius:22px; padding:30px 24px;
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.6);
    position:relative; overflow:hidden;
  }
  .tag{position:absolute; top:16px; left:16px; font-size:12px; color:var(--muted); background:#f3f4f6; padding:3px 10px; border-radius:999px;}
  .badge-mastered{position:absolute; top:16px; right:16px; font-size:12px; color:#fff; background:var(--ok); padding:3px 10px; border-radius:999px; display:none;}
  .badge-mastered.show{display:inline-block;}

  .word-en{
    font-family:Georgia,"Times New Roman",serif;
    font-size:34px; font-weight:700; text-align:center; margin:34px 0 6px;
    letter-spacing:.3px; word-break:break-word; color:var(--ink);
  }
  .word-cn{font-size:21px; text-align:center; color:var(--primary); font-weight:600; margin:8px 0 2px; word-break:break-word;}
  .word-common{font-size:14px; text-align:center; color:var(--muted); margin-top:10px;}
  .word-common .c{color:#9ca3af; text-decoration:line-through; margin-right:8px;}
  .word-common .arrow{color:var(--pink); font-weight:700;}

  .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:600; font-size:14.5px;
    padding:11px 20px; border-radius:12px; transition:all .16s; color:#fff; background:var(--primary);
    box-shadow:0 6px 14px rgba(79,70,229,.24);
  }
  .btn:hover{transform:translateY(-1px); filter:brightness(1.05);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:#fff; color:var(--primary); border:1px solid var(--primary); box-shadow:none;}
  .btn.speak{background:var(--pink); box-shadow:0 6px 14px rgba(236,72,153,.26);}
  .btn.ok{background:var(--ok); box-shadow:0 6px 14px rgba(22,163,74,.24);}
  .btn.soft{background:#eef2ff; color:var(--primary); box-shadow:none;}
  .btn.small{padding:8px 14px; font-size:13px;}

  .flash-hint{text-align:center; color:var(--muted); font-size:12.5px; margin-top:8px;}
  .progress{text-align:center; font-size:13px; color:var(--muted); margin-top:14px;}

  /* 答题 */
  .q-head{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .q-head .streak{color:var(--amber); font-weight:700;}
  .q-word{text-align:center; margin:8px 0 4px;}
  .q-word .en{font-family:Georgia,serif; font-size:30px; font-weight:700; word-break:break-word;}
  .q-word .cn{font-size:22px; font-weight:600; color:var(--primary); word-break:break-word;}
  .q-prompt{text-align:center; color:var(--muted); font-size:13.5px; margin:2px 0 14px;}

  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:560px){.opts{grid-template-columns:1fr;}}
  .opt{
    border:1.5px solid var(--line); background:#fff; border-radius:13px; padding:14px 14px;
    cursor:pointer; font-size:14.5px; text-align:left; transition:all .15s; color:var(--ink); font-weight:500; word-break:break-word;
  }
  .opt:hover{border-color:var(--primary-2); background:#f5f6ff;}
  .opt .k{display:inline-block; width:22px; height:22px; line-height:20px; text-align:center; border-radius:50%; background:#eef2ff; color:var(--primary); font-size:12px; margin-right:8px; font-weight:700;}
  .opt.right{background:var(--okbg); border-color:var(--ok); color:#14532d;}
  .opt.right .k{background:var(--ok); color:#fff;}
  .opt.wrong{background:var(--badbg); border-color:var(--bad); color:#7f1d1d;}
  .opt.wrong .k{background:var(--bad); color:#fff;}
  .opt:disabled{cursor:default;}

  .feedback{margin-top:16px; text-align:center;}
  .feedback .msg{font-size:15px; font-weight:700;}
  .feedback .msg.good{color:var(--ok);}
  .feedback .msg.bad{color:var(--bad);}
  .feedback .ans{font-size:13.5px; color:var(--muted); margin-top:4px;}
  .ans-block{margin:6px 0 2px; text-align:center;}
  .ans-block .ans-en{font-family:Georgia,serif; font-size:24px; font-weight:700; color:var(--ink);}
  .ans-block .ans-cn{font-size:16px; color:var(--primary); margin-top:4px; font-weight:600;}

  /* 拼写模式 */
  .spell-box{display:flex; gap:10px; margin-top:4px; justify-content:center; align-items:center; flex-wrap:wrap;}
  .spell-input{
    flex:1; min-width:220px; max-width:460px; font-family:Georgia,"Times New Roman",serif; font-size:20px;
    padding:13px 16px; border:2px solid var(--line); border-radius:12px; outline:none; color:var(--ink);
    transition:border-color .15s; background:#fff;
  }
  .spell-input:focus{border-color:var(--primary-2);}
  .spell-hint{margin-top:12px; text-align:center; font-family:Georgia,serif; font-size:18px; color:var(--muted); letter-spacing:3px; word-break:break-word; min-height:26px;}

  /* 复习中心 */
  .review-bar{display:flex; justify-content:center; margin:0 0 16px;}
  .review-btn{
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    background:linear-gradient(90deg,#8b5cf6,#ec4899); color:#fff; font-weight:700; font-size:14.5px;
    padding:12px 22px; border-radius:999px; box-shadow:0 8px 20px rgba(139,92,246,.30); transition:transform .15s; font-family:inherit;
  }
  .review-btn:hover{transform:translateY(-1px);}
  .review-btn .dot{background:#fff; color:#7c3aed; font-size:12px; padding:1px 9px; border-radius:999px;}

  .rev-summary{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:16px 0 6px;}
  .rev-num{flex:1; min-width:110px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center;}
  .rev-num b{display:block; font-size:26px; color:var(--primary);}
  .rev-num span{font-size:12.5px; color:var(--muted);}
  .rev-num.due b{color:var(--pink);}
  .rev-num.done b{color:var(--ok);}

  .rev-list{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .rev-item{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 14px;}
  .rev-item .en{font-family:Georgia,serif; font-weight:700; font-size:15px; flex:1; word-break:break-word;}
  .rev-item .cn{font-size:13px; color:var(--muted); flex:1; word-break:break-word;}
  .rev-item .stage{font-size:11.5px; color:#fff; background:var(--amber); padding:2px 9px; border-radius:999px; white-space:nowrap;}
  .rev-item .stage.done{background:var(--ok);}
  .rev-item .spk{border:none; background:#f3e8ff; color:#7c3aed; width:34px; height:34px; border-radius:10px; cursor:pointer; flex:none; font-size:12px;}
  .back-link{display:inline-block; margin-top:18px; color:var(--primary); cursor:pointer; font-size:14px; font-weight:600;}
  .rev-empty{text-align:center; color:var(--muted); padding:30px 10px;}

  /* 词库管理 */
  .review-btn.manage{background:linear-gradient(90deg,#3b82f6,#6366f1); box-shadow:0 8px 20px rgba(59,130,246,.28);}
  .manage-form{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  @media(max-width:560px){.manage-form{grid-template-columns:1fr;}}
  .manage-form input{
    border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; font-size:14px; outline:none; color:var(--ink); background:#fff;
  }
  .manage-form input:focus{border-color:var(--primary-2);}
  .manage-ta{
    width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; font-size:14px;
    font-family:inherit; outline:none; resize:vertical; color:var(--ink); background:#fff; line-height:1.6;
  }
  .manage-ta:focus{border-color:var(--primary-2);}

  /* 云同步 */
  .sync-box{background:#f5f6ff; border:1px solid #e0e4ff; border-radius:14px; padding:14px 16px; margin-top:14px;}
  .sync-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .sync-input{
    flex:1; min-width:180px; border:1.5px solid var(--line); border-radius:10px; padding:9px 13px;
    font-size:14px; outline:none; color:var(--ink); background:#fff;
  }
  .sync-input:focus{border-color:var(--primary-2);}
  .sync-status{margin-top:8px; font-size:12.5px; color:var(--muted); min-height:18px;}

  .listen-btn-wrap{text-align:center; margin:18px 0 4px;}
  .listen-big{
    width:84px; height:84px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 30% 30%,#fb7185,#ec4899); color:#fff;
    box-shadow:0 10px 26px rgba(236,72,153,.35); transition:transform .15s;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .listen-big:hover{transform:scale(1.05);}
  .listen-big.playing{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(236,72,153,.35);}50%{box-shadow:0 0 0 14px rgba(236,72,153,.10);}}

  /* 完成弹层 */
  .overlay{position:fixed; inset:0; background:rgba(30,27,75,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:22px; padding:30px 26px; max-width:360px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 6px; font-size:22px;}
  .modal .score{font-size:40px; font-weight:800; background:linear-gradient(90deg,var(--primary),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .modal p{color:var(--muted); font-size:14px; margin:6px 0 20px;}
  .modal .btn{margin:4px;}

  footer{text-align:center; color:#9ca3af; font-size:12px; margin-top:26px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2007 考研英语一 · Text 3 单词闯关</h1>
    <p>熟词僻义 · 阅读高频短语 · 图片画线语境生词 | 听发音 + 记意思</p>
  </header>

  <div class="cats" id="cats"></div>
  <div class="modes" id="modes"></div>
  <div class="stats" id="stats"></div>
  <div class="review-bar" id="reviewBar"></div>
  <div id="app"></div>
  <footer>词条均来自《2007 英语一 Text3 精读复盘》，未额外添加词义</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="moTitle">本轮完成</h2>
    <div class="score" id="moScore">0%</div>
    <p id="moDesc"></p>
    <button class="btn" onclick="restartRound();">再来一轮</button>
    <button class="btn ghost" onclick="continueRound();">继续复习</button>
  </div>
</div>

<script>
"use strict";

/* ============ 词条数据（全部来自上传文件，未额外添加词义） ============ */
var DATA = {
  context: {
    label: "图片画线语境生词",
    desc: "文中画横线的不懂词 · 词义",
    items: [
      {w:"diagnosis", m:"n. 诊断（结果）"},
      {w:"spouse", m:"n. 配偶"},
      {w:"stripes", m:"n. 种类、类型（of all stripes 各色各样的）"},
      {w:"budgeted", m:"v. 按预算安排；精打细算"},
      {w:"parachute", m:"n. 降落伞；比喻“安全网/保障”"},
      {w:"weather", m:"v. 经受住、度过（困难）"},
      {w:"absorb", m:"v. 承担、承受（风险/成本）"},
      {w:"interest rates", m:"n. 利率"},
      {w:"fluctuation", m:"n. 波动"},
      {w:"harsh reality", m:"n. 严酷现实"},
      {w:"outlive", m:"v. 活得比…久；耗尽（退休金）"},
      {w:"campaigned", m:"v. 发起运动、推动改革"},
      {w:"savings-account", m:"n. 储蓄账户（作定语）"},
      {w:"trading", m:"v. 交换、置换"},
      {w:"guaranteed", m:"adj. 有保障的"},
      {w:"healthcare", m:"n. 医疗保健"},
      {w:"borne", m:"v. 承担（bear 的过去分词）"},
      {w:"legislative", m:"adj. 立法的、立法机构的"},
      {w:"deductibles", m:"n.（保险）免赔额"},
      {w:"dose", m:"n. 剂量；比喻“一份/大量”"},
      {w:"demographics", m:"n. 人口统计数据、人口特征"},
      {w:"attendant", m:"adj. 伴随的、随之而来的"},
      {w:"eightfold", m:"adv./adj. 八倍（的）"},
      {w:"overburdened", m:"adj. 不堪重负的"},
      {w:"fallout", m:"n.（负面）后果、余波"}
    ]
  },
  poly: {
    label: "熟词僻义",
    desc: "常见义 → 文中僻义",
    items: [
      {w:"count on", common:"数数", m:"依赖、指望"},
      {w:"weather", common:"n. 天气", m:"v. 经受住、度过"},
      {w:"absorb", common:"v. 吸收", m:"v. 承担（风险/成本）"},
      {w:"outlive", common:"v. 比…活得久", m:"v. 耗尽（退休金）"},
      {w:"dose", common:"n.（药）剂量", m:"n. 大量、一份（风险）"},
      {w:"campaign", common:"n. 战役；运动", m:"v. 发起运动、推动"},
      {w:"solidly", common:"adv. 坚固地", m:"adv. 稳固地、完全地"},
      {w:"make up", common:"组成；化妆", m:"弥补、补偿"}
    ]
  },
  phrase: {
    label: "阅读高频短语",
    desc: "阅读常考搭配",
    items: [
      {w:"count on", m:"依靠、指望"},
      {w:"pink slip", m:"解雇通知书"},
      {w:"keep itself financially secure", m:"保持自身经济安稳"},
      {w:"reduce… from… to…", m:"使…从…沦为…"},
      {w:"side effect", m:"副作用"},
      {w:"as a result", m:"结果"},
      {w:"in times of", m:"在…时期"},
      {w:"weather bad times", m:"渡过难关"},
      {w:"make up", m:"弥补"},
      {w:"be asked to absorb", m:"被要求承担"},
      {w:"join millions of families", m:"加入…行列"},
      {w:"outlive one’s money", m:"钱不够用/活比钱久"},
      {w:"campaign to do", m:"推动…运动"},
      {w:"trade A for B", m:"用 A 交换 B"},
      {w:"from legislative halls to Wal-Mart workers", m:"从立法机构到普通劳动者"},
      {w:"a dose of", m:"一份、大量"},
      {w:"work against", m:"对…不利"},
      {w:"the odds of", m:"…的几率"},
      {w:"far less like… and a good deal more like…", m:"远非…而更像是…"},
      {w:"not be far behind", m:"紧随其后"}
    ]
  }
};

var CATS = [
  {key:"all", label:"全部", desc:""},
  {key:"context", label:"图片画线语境生词"},
  {key:"poly", label:"熟词僻义"},
  {key:"phrase", label:"阅读高频短语"}
];

var MODES = [
  {key:"flash", label:"闪卡学习"},
  {key:"quiz", label:"看词选义"},
  {key:"listen", label:"听音选义"},
  {key:"match", label:"看义选词"},
  {key:"spell", label:"拼写模式"}
];

var state = {
  category:"all",
  mode:"flash",
  pool:[],
  flashIdx:0,
  showCn:true,
  mastered: loadJSON("text3_mastered", {}),
  stats: loadJSON("text3_stats", {correct:0, total:0}),
  review: loadJSON("text3_review", {}),
  custom: loadJSON("text3_custom", []),
  view: "game",
  streak:0, bestStreak:0
};

/* 艾宾浩斯遗忘曲线复习节点（距首次学习的天数，21天周期：当天先巩固，再按 1/3/7/14/21 天复习） */
var REVIEW_DAYS = [0, 1, 3, 7, 14, 21];

/* ============ 工具函数 ============ */
function loadJSON(key, def){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){ return String(s); }

function buildPool(){
  var arr = [];
  var groups = ["context","poly","phrase"];
  for(var g=0; g<groups.length; g++){
    var key = groups[g];
    if(state.category!=="all" && state.category!==key) continue;
    for(var i=0;i<DATA[key].items.length;i++){
      var it = DATA[key].items[i];
      arr.push({w:it.w, m:it.m, common:it.common||null, group:key, groupLabel:DATA[key].label});
    }
  }
  // 合并用户自定义生词
  for(var j=0;j<state.custom.length;j++){
    var c = state.custom[j];
    if(!c || !c.w || !c.m) continue;
    var gname = c.group || "我的生词";
    if(state.category==="all" || state.category===("c:"+gname)){
      arr.push({w:c.w, m:c.m, common:c.common||null, group:"c:"+gname, groupLabel:gname});
    }
  }
  return shuffle(arr);
}

/* ============ 21天艾宾浩斯复习：数据与工具 ============ */
var WORD_INDEX = {};
function rebuildWordIndex(){
  WORD_INDEX = {};
  var groups = ["context","poly","phrase"];
  for(var g=0;g<groups.length;g++){
    var items = DATA[groups[g]].items;
    for(var i=0;i<items.length;i++){
      if(!WORD_INDEX[items[i].w]) WORD_INDEX[items[i].w] = items[i];
    }
  }
  for(var j=0;j<state.custom.length;j++){
    var c = state.custom[j];
    if(c && c.w && !WORD_INDEX[c.w]) WORD_INDEX[c.w] = c;
  }
}

function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(dateStr, n){
  var d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function reviewNextDate(r){
  if(!r || r.stage >= REVIEW_DAYS.length) return null;
  return addDays(r.start, REVIEW_DAYS[r.stage]);
}
function saveReview(){ saveJSON("text3_review", state.review); }
function registerLearned(w){
  if(!state.review[w]){
    state.review[w] = {start: todayStr(), stage: 0};
    saveReview();
  }
}
function getDueWords(){
  var t = todayStr(), due = [];
  for(var w in state.review){
    if(!WORD_INDEX[w]) continue;
    var nd = reviewNextDate(state.review[w]);
    if(nd && nd <= t) due.push(w);
  }
  return due.sort();
}
function getReviewStats(){
  var t = todayStr(), due = 0, inProgress = 0, done = 0;
  for(var w in state.review){
    var nd = reviewNextDate(state.review[w]);
    if(!nd){ done++; }
    else if(nd <= t){ due++; }
    else { inProgress++; }
  }
  return {due:due, inProgress:inProgress, done:done};
}
function stageLabel(r){
  if(!r || r.stage >= REVIEW_DAYS.length) return "已记住";
  if(r.stage===0) return "今日新学";
  return "第 " + REVIEW_DAYS[r.stage] + " 天复习";
}

/* ============ 发音（Web Speech API） ============ */
var synth = window.speechSynthesis || null;
function cleanSpeakText(t){
  return String(t).replace(/…|\.\.\./g, " something ");
}
function pickVoice(){
  if(!synth) return null;
  var vs = synth.getVoices() || [];
  var prefer = ["Google US English","Samantha","Microsoft Zira","Microsoft Aria","Karen","Daniel","en-US"];
  for(var p=0;p<prefer.length;p++){
    for(var i=0;i<vs.length;i++){
      if(vs[i].name && vs[i].name.indexOf(prefer[p])>=0) return vs[i];
    }
  }
  for(var j=0;j<vs.length;j++){ if(vs[j].lang && vs[j].lang.toLowerCase().indexOf("en")===0) return vs[j]; }
  return null;
}
function speak(text, cb){
  if(!synth){ if(cb) cb(); return; }
  synth.cancel();
  var u = new SpeechSynthesisUtterance(cleanSpeakText(text));
  u.lang = "en-US";
  u.rate = 0.82;
  var v = pickVoice(); if(v) u.voice = v;
  if(cb){ u.onend = cb; u.onerror = function(){ if(cb) cb(); }; }
  synth.speak(u);
}

/* ============ 统计 ============ */

}

function renderReviewBar(){

/* ============ 主渲染 ============ */
function render(){

/* ============ 模式一：闪卡学习 ============ */
function renderFlash(){

        '<button class="btn speak" onclick="speakCurrent()">听发音</button>' +

      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn soft" onclick="flashMove(-1)">上一词</button>' +

function speakCurrent(){
  var item = state.pool[state.flashIdx];
  speak(item.w);
}
function toggleCn(){ state.showCn = !state.showCn; render(); }
function flashMove(d){
  state.flashIdx = (state.flashIdx + d + state.pool.length) % state.pool.length;
  state.showCn = true;
  render();
  speak(state.pool[state.flashIdx].w);
}
function toggleMastered(){
  var item = state.pool[state.flashIdx];
  if(state.mastered[item.w]){ delete state.mastered[item.w]; }
  else{ state.mastered[item.w] = true; registerLearned(item.w); }
  saveJSON("text3_mastered", state.mastered);
  render();
}

/* ============ 选择题公共逻辑 ============ */
var cur = null;   // 当前题目
var queue = [];
var roundTotal = 0, roundCorrect = 0;
var quizQueue = [];   // 看词选义：待做题目队列（答错的题会自动重考）
var quizDone = {};    // 看词选义：本轮已答对的词

function nextFromQueue(){
  if(queue.length===0){ queue = shuffle(state.pool); }
  return queue.pop();
}
function buildOptions(item, pickMeaning){
  // 正确项
  var correct = pickMeaning ? item.m : item.w;
  var distractors = [];
  // 干扰池：同组其他词条
  for(var i=0;i<state.pool.length;i++){
    var o = state.pool[i];
    if(o===item) continue;
    var cand = pickMeaning ? o.m : o.w;
    if(cand!==correct && distractors.indexOf(cand)<0) distractors.push(cand);
  }
  // 熟词僻义：选义（中文）时把"常见义"也加入干扰（更强干扰）
  if(pickMeaning && item.common && distractors.indexOf(item.common)<0){ distractors.push(item.common); }
  distractors = shuffle(distractors).slice(0,3);
  var opts = shuffle([correct].concat(distractors));
  return {correct:correct, opts:opts};
}

function optLetter(i){ return String.fromCharCode(65+i); }

function answerBox(item, promptHtml, bodyHtml, correctText){
  var html =
    '<div class="card">' +
      '<div class="tag">'+esc(item.groupLabel)+'</div>' +
      '<div class="q-head"><span>第 '+(state.stats.total+1)+' 题</span><span class="streak">连击 '+state.streak+'</span></div>' +
      promptHtml + bodyHtml +
      '<div class="opts" id="opts"></div>' +
      '<div class="feedback" id="feedback"></div>' +
    '</div>';
  document.getElementById("app").innerHTML = html;
  var optsBox = document.getElementById("opts");
  var html2 = "";
  for(var i=0;i<cur.opts.length;i++){
    html2 += '<button class="opt" onclick="choose('+i+')"><span class="k">'+optLetter(i)+'</span>'+esc(cur.opts[i])+'</button>';
  }
  optsBox.innerHTML = html2;
}

function choose(i){
  if(cur.locked) return;
  cur.locked = true;
  var isQuiz = cur.kind === "quiz";
  var optsBox = document.getElementById("opts");
  var btns = optsBox.querySelectorAll(".opt");
  var picked = cur.opts[i];
  var right = picked === cur.correct;
  state.stats.total++;
  roundTotal++;
  if(right){
    state.stats.correct++; roundCorrect++; state.streak++;
    if(state.streak>state.bestStreak) state.bestStreak = state.streak;
    registerLearned(cur.item.w);
    if(!isQuiz && cur.item) speak(cur.item.w);
  } else {
    state.streak = 0;
  }
  saveJSON("text3_stats", state.stats);

  for(var j=0;j<btns.length;j++){
    btns[j].disabled = true;
    if(cur.opts[j]===cur.correct) btns[j].classList.add("right");
    else if(j===i) btns[j].classList.add("wrong");
  }
  var fb = document.getElementById("feedback");
  if(right){
    if(isQuiz){
      // 看词选义：标记答对，等单词读完再跳下一题
      quizDone[cur.item.w] = true;
      fb.innerHTML = '<div class="msg good">回答正确</div>';
      speak(cur.item.w, function(){ startQuiz(); });
    } else {
      fb.innerHTML = '<div class="msg good">回答正确</div>' +
        '<div class="btn-row"><button class="btn" onclick="nextQuestion()">下一题</button></div>';
    }
  } else {
    var ansHtml;
    if(isQuiz){
      ansHtml = '<div class="ans-block"><div class="ans-en">'+esc(cur.item.w)+'</div><div class="ans-cn">'+esc(cur.item.m)+'</div></div>';
    } else {
      var ansTxt = cur.pickMeaning ? cur.item.w+" — "+cur.item.m : cur.item.m;
      ansHtml = '<div class="ans">正确答案：'+esc(ansTxt)+'</div>';
    }
    fb.innerHTML =
      '<div class="msg bad">回答错误</div>' +
      ansHtml +
      '<div class="btn-row"><button class="btn" onclick="'+(isQuiz?'startQuiz()':'nextQuestion()')+'">下一题</button></div>';
  }
  renderStats();
  renderReviewBar();
}

function nextQuestion(){
  if(roundTotal>0 && roundTotal % state.pool.length === 0){
    showRoundSummary();
    return;
  }
  if(cur.kind==="spell"){ startSpell(); }
  else { startQuestion(cur.kind); }
}

function showRoundSummary(){
  var pct = roundTotal ? Math.round(roundCorrect/roundTotal*100) : 0;
  document.getElementById("moTitle").textContent = "本轮完成";
  document.getElementById("moScore").textContent = pct + "%";
  document.getElementById("moDesc").textContent = "本轮共 " + roundTotal + " 题，答对 " + roundCorrect + " 题，最佳连击 " + state.bestStreak + "。";
  document.getElementById("overlay").classList.add("show");
}

/* ============ 模式二：看词选义 ============ */
function renderQuiz(){ startQuiz(); }

function startQuiz(){
  if(state.pool.length===0) return;
  var item = nextQuizItem();
  if(!item) return;
  cur = {item:item, kind:"quiz", locked:false, pickMeaning:true};
  var b = buildOptions(item, true);
  cur.opts = b.opts; cur.correct = b.correct;
  answerBox(item,
    '<div class="q-word"><div class="en">'+esc(item.w)+'</div></div>' +
    '<div class="btn-row" style="margin-top:10px;"><button class="btn speak small" onclick="speakCurrentQuiz()">听发音</button></div>' +
    '<div class="q-prompt">选出该词对应的中文意思</div>',
    "", "");
}

function nextQuizItem(){
  if(quizQueue.length===0){
    var remaining = state.pool.filter(function(it){ return !quizDone[it.w]; });
    if(remaining.length===0){
      showRoundSummary();
      return null;
    }
    quizQueue = shuffle(remaining);
  }
  return quizQueue.shift();
}
/* ============ 模式三：听音选义 ============ */
function renderListen(){ startQuestion("listen"); }
/* ============ 模式四：看义选词 ============ */
function renderMatch(){ startQuestion("match"); }

function startQuestion(kind){
  if(state.pool.length===0) return;
  var item = nextFromQueue();
  cur = {item:item, kind:kind, locked:false, pickMeaning:kind!=="match"};

  if(kind==="listen"){
    var b2 = buildOptions(item, true);
    cur.opts = b2.opts; cur.correct = b2.correct;
    var hintHtml = '<div class="q-word" id="listenWord" style="display:none;"><div class="en" style="font-size:20px;color:#6b7280;">'+esc(item.w)+'</div></div>';
    answerBox(item,
      '<div class="listen-btn-wrap"><button class="listen-big" id="listenBtn" onclick="replayListen()">' + speakerSVG() + '</button></div>' +
      hintHtml +
      '<div class="q-prompt">听发音，选出对应的中文意思' +
      ' · <a href="javascript:void(0)" onclick="toggleListenWord()" style="color:#6366f1;">显示单词</a></div>',
      "", "");
    speak(item.w);
  }
  else if(kind==="match"){
    var b3 = buildOptions(item, false);
    cur.opts = b3.opts; cur.correct = b3.correct;
    answerBox(item,
      '<div class="q-word"><div class="cn">'+esc(item.m)+'</div></div>' +
      '<div class="q-prompt">选出对应的英文表达</div>',
      "", "");
  }
}
function speakCurrentQuiz(){ if(cur && cur.item) speak(cur.item.w); }
function replayListen(){ if(cur && cur.item) speak(cur.item.w); }
function toggleListenWord(){
  var el = document.getElementById("listenWord");
  if(el){ el.style.display = el.style.display==="none" ? "block" : "none"; }
}

/* ============ 模式五：拼写模式 ============ */
function renderSpell(){ startSpell(); }

function startSpell(){
  if(state.pool.length===0) return;
  var item = nextFromQueue();
  cur = {item:item, kind:"spell", locked:false, pickMeaning:true};
  document.getElementById("app").innerHTML =
    '<div class="card">' +
      '<div class="tag">'+esc(item.groupLabel)+'</div>' +
      '<div class="q-head"><span>第 '+(state.stats.total+1)+' 题</span><span class="streak">连击 '+state.streak+'</span></div>' +
      '<div class="q-word"><div class="cn">'+esc(item.m)+'</div></div>' +
      (item.common ? '<div class="word-common"><span class="c">常见义：'+esc(item.common)+'</span></div>' : '') +
      '<div class="q-prompt">根据中文意思拼写英文（可点“听发音”提示）</div>' +
      '<div class="btn-row" style="margin-top:0;"><button class="btn speak small" onclick="speakCurrentQuiz()">听发音</button><button class="btn soft small" onclick="spellShowHint()">字母提示</button></div>' +
      '<div class="spell-box">' +
        '<input class="spell-input" id="spellInput" placeholder="输入英文…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="spellKey(event)">' +
        '<button class="btn" onclick="submitSpell()">提交</button>' +
      '</div>' +
      '<div class="spell-hint" id="spellHint"></div>' +
      '<div class="feedback" id="feedback"></div>' +
    '</div>';
  var inp = document.getElementById("spellInput");
  if(inp) inp.focus();
}

function spellKey(e){
  if(e.key!=="Enter") return;
  e.preventDefault();
  if(cur && cur.kind==="review"){ submitReviewSpell(); }
  else { submitSpell(); }
}

function spellShowHint(){
  if(!cur || cur.locked) return;
  var w = cur.item.w;
  var parts = w.split(/\s+/).map(function(word){
    var letters = word.replace(/[^A-Za-z]/g, "");
    if(!letters) return word;
    return letters.charAt(0) + "_".repeat(Math.max(0, letters.length-1));
  });
  document.getElementById("spellHint").innerHTML = "提示：" + esc(parts.join("  "));
}

function normalizeSpelling(s){
  return String(s).trim().toLowerCase()
    .replace(/\.\.\./g, "…")
    .replace(/\s*…\s*/g, "…")
    .replace(/\s+/g, " ")
    .replace(/’/g, "'")
    .replace(/[–—]/g, "-");
}

function submitSpell(){
  if(!cur || cur.locked) return;
  var inp = document.getElementById("spellInput");
  if(!inp) return;
  var val = inp.value;
  if(!val.trim()) return;
  cur.locked = true;
  var right = normalizeSpelling(val) === normalizeSpelling(cur.item.w);
  state.stats.total++; roundTotal++;
  if(right){
    state.stats.correct++; roundCorrect++; state.streak++;
    if(state.streak>state.bestStreak) state.bestStreak = state.streak;
    registerLearned(cur.item.w);
    speak(cur.item.w);
  } else {
    state.streak = 0;
  }
  saveJSON("text3_stats", state.stats);
  var fb = document.getElementById("feedback");
  fb.innerHTML =
    '<div class="msg '+(right?"good":"bad")+'">'+(right?"拼写正确":"拼写有误")+'</div>' +
    '<div class="ans">正确答案：'+esc(cur.item.w)+' — '+esc(cur.item.m)+'</div>' +
    '<div class="btn-row"><button class="btn" onclick="nextQuestion()">下一题</button></div>';
  renderStats();
  renderReviewBar();
}

/* ============ 21天艾宾浩斯复习中心 ============ */
var reviewQueue = [], reviewPassed = 0, reviewFailed = 0;

function openReview(){ state.view = "review"; render(); }
function closeReview(){ state.view = "game"; render(); }

function escJS(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function renderReviewCenter(){
  var st = getReviewStats();
  var dueWords = getDueWords();
  var listHtml = "";
  if(dueWords.length===0){
    listHtml = '<div class="rev-empty">今天没有需要复习的单词。先去游戏里学习新词吧，学过的词会自动进入 21 天复习计划。</div>';
  } else {
    for(var i=0;i<dueWords.length;i++){
      var w = dueWords[i];
      var r = state.review[w];
      var item = WORD_INDEX[w];
      var cn = item ? item.m : "";
      listHtml += '<div class="rev-item">' +
        '<button class="spk" onclick="speak(\''+escJS(w)+'\')">▶</button>' +
        '<div class="en">'+esc(w)+'</div>' +
        '<div class="cn">'+esc(cn)+'</div>' +
        '<div class="stage">'+stageLabel(r)+'</div>' +
      '</div>';
    }
  }

  document.getElementById("app").innerHTML =
    '<div class="card" style="padding:26px 20px;">' +
      '<div class="q-head" style="margin-bottom:2px;"><span style="font-size:15px;font-weight:700;color:var(--ink);">21天艾宾浩斯遗忘曲线复习</span><a class="back-link" style="margin-top:0;" onclick="closeReview()">← 返回游戏</a></div>' +
      '<p style="color:var(--muted);font-size:13px;margin:4px 0 2px;">按艾宾浩斯遗忘曲线，在学后的第 1、3、7、14、21 天自动提醒复习（当天学完即可先巩固一次）。</p>' +
      '<div class="rev-summary">' +
        '<div class="rev-num due"><b>'+st.due+'</b><span>今日待复习</span></div>' +
        '<div class="rev-num"><b>'+st.inProgress+'</b><span>计划进行中</span></div>' +
        '<div class="rev-num done"><b>'+st.done+'</b><span>已长期记住</span></div>' +
      '</div>' +
      (dueWords.length>0 ? '<div class="btn-row" style="margin-top:6px;"><button class="btn" onclick="startReviewSession()">开始今日复习（'+dueWords.length+' 个）</button></div>' : '') +
      '<div style="margin-top:16px;font-size:14px;font-weight:700;color:var(--ink);">今日复习清单</div>' +
      '<div class="rev-list">'+listHtml+'</div>' +
      '<div style="text-align:center;margin-top:16px;"><a class="back-link" onclick="closeReview()">← 返回游戏</a></div>' +
    '</div>';
}

function startReviewSession(){
  reviewQueue = getDueWords().slice();
  reviewPassed = 0; reviewFailed = 0;
  renderReviewItem();
}

function renderReviewItem(){
  if(reviewQueue.length===0){ finishReviewSession(); return; }
  var w = reviewQueue[0];
  var item = WORD_INDEX[w];
  if(!item){ reviewQueue.shift(); renderReviewItem(); return; }
  var r = state.review[w];
  cur = {item:item, kind:"review", locked:false, entryW:w};
  document.getElementById("app").innerHTML =
    '<div class="card">' +
      '<div class="tag">复习 · '+stageLabel(r)+'</div>' +
      '<div class="q-head"><span>剩余 '+(reviewQueue.length)+' 个</span><span class="streak">已过 '+reviewPassed+' · 未过 '+reviewFailed+'</span></div>' +
      '<div class="q-word"><div class="cn">'+esc(item.m)+'</div></div>' +
      '<div class="q-prompt">根据中文意思拼写英文（可听发音）</div>' +
      '<div class="btn-row" style="margin-top:0;"><button class="btn speak small" onclick="speakReviewWord()">听发音</button><button class="btn soft small" onclick="spellShowHint()">字母提示</button></div>' +
      '<div class="spell-box">' +
        '<input class="spell-input" id="spellInput" placeholder="输入英文…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="spellKey(event)">' +
        '<button class="btn" onclick="submitReviewSpell()">提交</button>' +
      '</div>' +
      '<div class="spell-hint" id="spellHint"></div>' +
      '<div class="feedback" id="feedback"></div>' +
    '</div>';
  var inp = document.getElementById("spellInput");
  if(inp) inp.focus();
}

function speakReviewWord(){ if(cur && cur.item) speak(cur.item.w); }

function submitReviewSpell(){
  if(!cur || cur.locked) return;
  var inp = document.getElementById("spellInput");
  if(!inp) return;
  var val = inp.value;
  if(!val.trim()) return;
  cur.locked = true;
  var right = normalizeSpelling(val) === normalizeSpelling(cur.item.w);
  var w = cur.entryW;
  var r = state.review[w];
  if(right){
    if(r) r.stage++;
    reviewPassed++;
    speak(cur.item.w);
  } else {
    reviewFailed++;
  }
  saveReview();
  var fb = document.getElementById("feedback");
  fb.innerHTML =
    '<div class="msg '+(right?"good":"bad")+'">'+(right?"复习通过":"未通过，明天继续巩固")+'</div>' +
    '<div class="ans">正确答案：'+esc(cur.item.w)+' — '+esc(cur.item.m)+'</div>' +
    '<div class="btn-row"><button class="btn" onclick="nextReviewItem()">下一个</button></div>';
}

function nextReviewItem(){
  reviewQueue.shift();
  renderReviewItem();
}

function finishReviewSession(){
  saveReview();
  document.getElementById("app").innerHTML =
    '<div class="card" style="text-align:center;">' +
      '<h2 style="margin:8px 0 4px;">本次复习完成</h2>' +
      '<p style="color:var(--muted);font-size:14px;">通过 '+reviewPassed+' 个 · 待巩固 '+reviewFailed+' 个</p>' +
      '<p style="color:var(--muted);font-size:13px;">通过后复习节点自动顺延，21 天周期内反复巩固；未通过的明天继续。</p>' +
      '<div class="btn-row"><button class="btn" onclick="renderReviewCenter()">返回复习清单</button><button class="btn ghost" onclick="closeReview()">返回游戏</button></div>' +
    '</div>';
  renderReviewBar();
}

var SUPABASE_URL = "https://vyvsmfhpayggxvrxazcj.supabase.co";
var SUPABASE_KEY = "sb_publishable_12HuuJIzOqt5RehfQhIKLg_T5oZrRu1";

function cloudUpload(){
  var code = (document.getElementById("syncCode").value||"").trim();
  if(!code){ alert("请先输入同步码"); return; }
  saveJSON("text3_sync_code", code);
  var payload = { v:1, custom:state.custom, mastered:state.mastered, stats:state.stats, review:state.review, updatedAt:Date.now() };
  fetch(SUPABASE_URL + "/rest/v1/word_sync", {
    method:"POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify({code:code, payload:payload})
  }).then(function(r){
    if(r.ok){ setSyncStatus("已上传到云端 ✓ " + timeNow()); }
    else { r.text().then(function(t){ setSyncStatus("上传失败：" + t); }); }
  }).catch(function(e){ setSyncStatus("网络错误：" + e.message); });
}

function cloudDownload(){
  var code = (document.getElementById("syncCode").value||"").trim();
  if(!code){ alert("请先输入同步码"); return; }
  saveJSON("text3_sync_code", code);
  fetch(SUPABASE_URL + "/rest/v1/word_sync?code=eq." + encodeURIComponent(code) + "&select=payload", {
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, data:j}; }); })
  .then(function(res){
    if(!res.ok){ setSyncStatus("读取失败，请检查同步码是否正确"); return; }
    if(!res.data || res.data.length===0){ setSyncStatus("云端没有该同步码的数据，请先在另一台设备点“上传到云端”"); return; }
    var p = res.data[0].payload;
    if(!p){ setSyncStatus("云端数据为空"); return; }
    if(p.custom) state.custom = p.custom;
    if(p.mastered) state.mastered = p.mastered;
    if(p.stats) state.stats = p.stats;
    if(p.review) state.review = p.review;
    saveJSON("text3_custom", state.custom);
    saveJSON("text3_mastered", state.mastered);
    saveJSON("text3_stats", state.stats);
    saveJSON("text3_review", state.review);
    rebuildWordIndex();
    state.pool = buildPool();
    render();
    setSyncStatus("已从云端同步 ✓ " + timeNow());
  }).catch(function(e){ setSyncStatus("网络错误：" + e.message); });
}

function setSyncStatus(msg){
  var el = document.getElementById("syncStatus");
  if(el) el.innerHTML = msg;
}
function timeNow(){
  var d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

/* ============ 词库管理：添加自己的生词 ============ */
function saveCustom(){ saveJSON("text3_custom", state.custom); }
function applyCustomChange(){
  saveCustom();
  rebuildWordIndex();
  if(state.category.indexOf("c:")===0){
    var gname = state.category.slice(2);
    var exists = state.custom.some(function(c){ return (c.group||"我的生词")===gname; });
    if(!exists) state.category = "all";
  }
  state.pool = buildPool();
  render();
}

function addWord(){
  var w = document.getElementById("mw").value.trim();
  var m = document.getElementById("mm").value.trim();
  var g = document.getElementById("mg").value.trim() || "我的生词";
  var c = document.getElementById("mc").value.trim() || "";
  if(!w || !m){ alert("请填写英文和中文意思"); return; }
  state.custom.push({w:w, m:m, group:g, common:c});
  applyCustomChange();
}

function importWords(){
  var txt = document.getElementById("mw2").value;
  var lines = txt.split(/\r?\n/);
  var added = 0;
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    var parts = line.split("|");
    if(parts.length>=2){
      var w = parts[0].trim();
      var m = parts[1].trim();
      var g = (parts[2]||"").trim() || "我的生词";
      var c = (parts[3]||"").trim() || "";
      if(w && m){ state.custom.push({w:w, m:m, group:g, common:c}); added++; }
    } else {
      var eq = line.split("=");
      if(eq.length>=2 && eq[0].trim() && eq[1].trim()){
        state.custom.push({w:eq[0].trim(), m:eq[1].trim(), group:"我的生词", common:""});
        added++;
      }
    }
  }
  if(added===0){ alert("没有识别到有效内容，请按格式输入"); return; }
  applyCustomChange();
}

function deleteWord(i){
  state.custom.splice(i,1);
  applyCustomChange();
}

function exportWords(){
  var lines = state.custom.map(function(c){
    return c.w + "|" + c.m + "|" + (c.group||"我的生词") + "|" + (c.common||"");
  }).join("\n");
  if(!lines){ alert("暂无自定义词可导出"); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lines).then(function(){
      alert("已复制到剪贴板（"+state.custom.length+" 条），可粘贴到备忘录或文档备份。");
    }, function(){ promptCopy(lines); });
  } else {
    promptCopy(lines);
  }
}
function promptCopy(lines){
  document.getElementById("mw2").value = lines;
  document.getElementById("mw2").focus();
  document.getElementById("mw2").select();
  alert("已放入下方文本框，请手动复制（Ctrl+C）");
}
function clearCustom(){
  if(state.custom.length===0){ alert("暂无自定义词"); return; }
  if(!confirm("确定清空全部自定义生词（共 "+state.custom.length+" 个）吗？内置词条不受影响。")) return;
  state.custom = [];
  applyCustomChange();
}
